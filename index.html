<!DOCTYPE html>
<html>
<head>
  <title>Dancing Hello Kitty</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Dancing Hello Kitty!</h1>
  <div id="hello-kitty-animation">
    <div id="hello-kitty-head">
      <div class="eye left-eye"></div>
      <div class="eye right-eye"></div>
      <div class="nose"></div>
      <!-- Bow will be via CSS on #hello-kitty-head -->
    </div>
    <div class="hello-kitty-body"></div>
    <div class="hello-kitty-dress"></div>
    <!-- Animation applies to #hello-kitty-animation -->
  </div>
  <script src="script.js"></script>
</body>
</html>
